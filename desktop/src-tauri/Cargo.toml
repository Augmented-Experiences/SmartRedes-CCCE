[package]
name = "smartredes"
version = "1.0.0"
description = "SmartRedes — asistente de marca y campañas digitales con IA local para PYMEs, de la Cámara Colombiana de Comercio Electrónico (CCCE)."
authors = ["Cámara Colombiana de Comercio Electrónico (CCCE)"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
ureq = { version = "2", default-features = false, features = ["tls", "native-tls"] }
zip = "0.6"
flate2 = "1"
tar = "0.4"

[[bin]]
name = "smartredes"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
